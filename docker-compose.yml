name: axis-openclaw-lab
x-limits: &locked
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
  restart: unless-stopped
services:
  gateway:
    <<: *locked
    hostname: ${COMPOSE_PROJECT_NAME:-axis-openclaw-lab}-gateway
    stop_grace_period: 60s
    build: {context: ., dockerfile: docker/Dockerfile.gateway}
    image: axis-openclaw-lab-gateway:local
    env_file: [.secrets/gateway.env]
    environment:
      TMPDIR: /home/node/.openclaw/tmp
      XDG_CACHE_HOME: /home/node/.openclaw/cache
      NODE_COMPILE_CACHE: /home/node/.openclaw/cache/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      MODEL_PROVIDER: ${MODEL_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      ANTHROPIC_API_VERSION: ${ANTHROPIC_API_VERSION:-2026-10-21}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_ID: ${MODEL_ID:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_CONTEXT_WINDOW: ${MODEL_CONTEXT_WINDOW:-}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-}
      AXIS_MULTI_AGENT: ${AXIS_MULTI_AGENT:-0}
      LINE_ENABLED: ${LINE_ENABLED:-0}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-app.github.dev}
    volumes:
      - lab-gateway:/home/node/.openclaw
      # Agent instructions and skills: edit files in ./workspace, then `docker compose restart gateway` (no rebuild).
      - ./workspace:/opt/axis/workspace:ro
      # Data (SQLite) the MCP server reads and writes.
      - ./data:/home/node/data
      # MCP server code and servers.json, registered at every start.
      - ./mcp:/home/node/mcp:ro
    ports: ['127.0.0.1:${AXIS_PORT:-18795}:18789']
    networks: [front]
    mem_limit: 3g
    cpus: 1.3
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
  webhook:
    profiles: [line]
    <<: *locked
    image: node:24-alpine
    user: '1000:1000'
    command: [node, /opt/axis/webhook.mjs]
    volumes: ['./scripts/webhook.mjs:/opt/axis/webhook.mjs:ro']
    environment: {UPSTREAM_HOST: gateway, UPSTREAM_PORT: '18789'}
    ports: ['127.0.0.1:18081:8080']
    networks: [front]
    mem_limit: 64m
    cpus: 0.1
    depends_on:
      gateway: {condition: service_healthy}
  tunnel:
    # Optional quick tunnel for the LINE webhook only. Free, no account, but the URL changes on every start:
    # read it with `npm run lab:tunnel-url`. Never point this at the gateway.
    profiles: [line]
    <<: *locked
    image: cloudflare/cloudflared:2026.10.7
    command: [tunnel, --no-autoupdate, --url, 'http://webhook:8080']
    networks: [front]
    mem_limit: 128m
    cpus: 0.2
    depends_on:
      webhook: {condition: service_started}
volumes:
  lab-gateway:
networks:
  front:
    # Fixed subnet so the Gateway can trust exactly one forwarding source (the bridge gateway that Docker port publishing comes from).
    ipam:
      config:
        - subnet: 172.28.77.0/24
          gateway: 172.28.77.1
